# Compila a versão Android (Android Auto) e publica um .apk pronto para instalar no celular.
name: Android (.apk)

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila o APK (release, arm64)
        working-directory: android
        # Só arm64-v8a: é a arquitetura do Galaxy S24 Ultra e da maioria dos celulares atuais.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Separa o .apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk CarMirror.apk
          ls -lh CarMirror.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarMirror-apk
          path: CarMirror.apk
          retention-days: 30
